allowBuilds:
  esbuild: false
  # fhirpath preinstall only sets up its demo app
  fhirpath: false

# pdfjs-dist's optional Node renderer and its native toolchain (node-pre-gyp,
# tar); the UI renders PDFs in the browser
ignoredOptionalDependencies:
  - canvas

minimumReleaseAgeExclude:
  - '@health-samurai/aidbox-client@1.0.0'
  - '@health-samurai/aidbox-fhirpath-lsp@1.0.0'
  - '@health-samurai/react-components@1.0.0'
  - '@formbox/hs-theme@0.5.0'

# For vulnerabilities in transitive deps
overrides:
  # @health-samurai/aidbox-fhirpath-lsp -> @atomic-ehr/fhirpath,
  fast-xml-parser: ^5.12.1
  # @mcp-b/global
  zod@<4.6.6: ^4.6.6
  # @lhncbc/ucum-lhc lists csv-parse 4 but never imports it
  csv-parse@<7.0.2: ^7.0.2
